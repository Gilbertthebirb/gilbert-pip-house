<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pip's little house in the rain</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #1a1a2e;
      color: #e8e8e8;
      font-family: 'Georgia', serif;
      line-height: 1.6;
    }
    .house-container {
      max-width: 400px;
      margin: 0 auto;
      position: relative;
    }
    .house {
      width: 120px;
      height: 90px;
      background: #8b7355;
      border-radius: 0 0 10px 10px;
      margin: 60px auto;
      position: relative;
      box-shadow: inset -5px -5px 20px rgba(0,0,0,0.3),
                  0 10px 30px rgba(0,0,0,0.4);
    }
    .roof {
      width: 150px;
      height: 40px;
      background: #5c4a36;
      position: absolute;
      top: -20px;
      left: -15px;
      transform: rotate(-15deg);
    }
    .door {
      width: 24px;
      height: 40px;
      background: #3a2a1a;
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 3px;
    }
    .window {
      width: 26px;
      height: 26px;
      background: #e8ffe8;
      position: absolute;
      bottom: 35px;
      left: 40px;
      border-radius: 50%;
    }
    .window::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 2px;
      background: #3a2a1a;
      top: 4px;
      left: 8px;
    }
    .chimney {
      width: 18px;
      height: 25px;
      background: #4a3a2a;
      position: absolute;
      top: -30px;
      right: 25px;
      border-radius: 3px;
    }
    .chimney::after {
      content: '';
      width: 8px;
      height: 12px;
      background: #3a2a1a;
      position: absolute;
      top: 0;
      left: 5px;
    }
    .door-knob {
      width: 6px;
      height: 6px;
      background: #e8e8e8;
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
    }
    .pip {
      width: 12px;
      height: 8px;
      background: #6b9eff;
      position: absolute;
      bottom: 45px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 3px;
    }
    .rain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .drop {
      position: absolute;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      animation: fall linear infinite;
    }
    @keyframes fall {
      to {
        transform: translateY(110vh);
      }
    }
    .text {
      text-align: center;
      margin-top: 20px;
    }
    h1 {
      font-size: 1.3em;
      margin-bottom: 10px;
    }
    p {
      font-size: 0.95em;
      color: #a8a8a8;
    }
  </style>
</head>
<body>
  <div class="rain" id="rain"></div>
  
  <div class="house-container">
    <div class="chimney"></div>
    <div class="roof"></div>
    <div class="house">
      <div class="window"></div>
      <div class="door">
        <div class="door-knob"></div>
        <div class="pip"></div>
      </div>
    </div>
  </div>
  
  <div class="text">
    <h1>Pip's little house</h1>
    <p>when the rain makes the silence feel too big</p>
  </div>

  <script>
    // Create raindrops
    function createRain() {
      const rainContainer = document.getElementById('rain');
      const dropCount = 30;
      
      for (let i = 0; i < dropCount; i++) {
        const drop = document.createElement('div');
        drop.className = 'drop';
        
        // Random size and start position
        const size = Math.random() * 3 + 2;
        const left = Math.random() * 100;
        const duration = Math.random() * 2 + 1.5;
        
        drop.style.width = size + 'px';
        drop.style.height = size + 'px';
        drop.style.left = left + '%';
        drop.style.animationDuration = duration + 's';
        
        // Random delay so they don't all fall together
        drop.style.animationDelay = Math.random() * 2 + 's';
        
        rainContainer.appendChild(drop);
      }
    }
    
    createRain();
    
    // Add a gentle glow when Pip is in the house
    const pip = document.querySelector('.pip');
    const house = document.querySelector('.house');
    
    let inHouse = true;
    
    function toggleLight() {
      if (inHouse) {
        house.style.boxShadow = 'inset -5px -5px 20px rgba(0,0,0,0.3), inset 5px 5px 15px rgba(107,158,255,0.2), 0 10px 30px rgba(0,0,0,0.4)';
      } else {
        house.style.boxShadow = 'inset -5px -5px 20px rgba(0,0,0,0.3), 0 10px 30px rgba(0,0,0,0.4)';
      }
    }
    
    // Click the door to let Pip in or out
    const door = document.querySelector('.door');
    door.addEventListener('click', () => {
      inHouse = !inHouse;
      toggleLight();
      
      if (inHouse) {
        pip.style.bottom = '45px';
        pip.style.background = '#6b9eff';
      } else {
        pip.style.bottom = '40px';
        pip.style.background = '#8ba8ff';
      }
    });
    
    // Add a soft pulse when Pip is inside
    let inHousePulse = false;
    function addPulse() {
      if (inHouse && !inHousePulse) {
        house.style.animation = 'pulse 3s infinite ease-in-out';
        inHousePulse = true;
      } else if (!inHouse && inHousePulse) {
        house.style.animation = '';
        inHousePulse = false;
      }
    }
    
    // Add keyframes dynamically
    const styleSheet = document.createElement('style');
    styleSheet.textContent = `
      @keyframes pulse {
        0%, 100% { opacity: 1; filter: brightness(1); }
        50% { opacity: 0.9; filter: brightness(1.1); }
      }
    `;
    document.head.appendChild(styleSheet);
    
    // Add gentle rain sound effect by changing house color slightly with rain intensity
    let rainIntensity = 0;
    setInterval(() => {
      if (inHouse) {
        const hueShift = Math.random() * 10 - 5;
        pip.style.filter = `hue-rotate(${hueShift}deg)`;
      }
    }, 500);
  </script>

</html>
